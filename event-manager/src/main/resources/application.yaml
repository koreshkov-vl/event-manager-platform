server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:yWZcs8dOhF5V/tPkjegsDRIWGTyILdLq/+5K7M99TLNwyg5MeaQ/voaWH6HRFld/H4TUtgkCYb6r6gy2lhEbbg==}
  expiration: ${JWT_EXPIRATION:600000}

event:
  status:
    cron: "0 */2 * * * *"

default:
  admin:
    login: ${DEFAULT_ADMIN_LOGIN:admin}
    pass: ${DEFAULT_ADMIN_PASS:admin}
    age: ${DEFAULT_ADMIN_AGE:30}

spring:
  application:
    name: event-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/event_manager
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml

logging:
  level:
    root: INFO
    org.springframework.web: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
