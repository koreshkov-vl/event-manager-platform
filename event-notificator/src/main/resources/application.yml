server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:yWZcs8dOhF5V/tPkjegsDRIWGTyILdLq/+5K7M99TLNwyg5MeaQ/voaWH6HRFld/H4TUtgkCYb6r6gy2lhEbbg==}

notification:
  cleanup:
    enabled: true
    retention-days: 7
    cron: "0 0 3 * * *"

spring:
  application:
    name: event-notificator
  datasource:
    url: jdbc:postgresql://localhost:5432/event_notifications
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: event-notificator
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "dev.sorokin.*"
        spring.json.value.default.type: dev.sorokin.kafka.dto.EventChangeKafkaMessage
        spring.json.use.type.headers: false
    listener:
      ack-mode: batch
    dlt:
      retry-interval-ms: 1000
      max-attempts: 3

logging:
  level:
    root: INFO
    org.springframework.web: INFO